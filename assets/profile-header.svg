<svg width="1400" height="360" viewBox="0 0 1400 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tanishk Gupta — Build systems. Solve problems.</title>
  <desc id="desc">A midnight-blue technical profile banner with a cyan T monogram, developer identity, and engineering focus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.58" stop-color="#0B1730"/>
      <stop offset="1" stop-color="#082F49"/>
    </linearGradient>
    <linearGradient id="glow" x1="190" y1="80" x2="430" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#7DD3FC" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1400" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1400" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1210" cy="40" r="260" fill="#0EA5E9" fill-opacity="0.08"/>
  <circle cx="1220" cy="25" r="170" stroke="#38BDF8" stroke-opacity="0.16"/>
  <path d="M0 304C240 250 366 334 612 278C858 222 1020 266 1400 164" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="2"/>
  <path d="M0 320C246 264 370 350 616 294C862 238 1020 282 1400 180" stroke="#7DD3FC" stroke-opacity="0.10" stroke-width="1"/>

  <g filter="url(#shadow)">
    <rect x="72" y="72" width="190" height="190" rx="32" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.65"/>
    <path d="M116 112H218V140H183V226H151V140H116V112Z" fill="url(#glow)"/>
    <circle cx="223" cy="218" r="7" fill="#7DD3FC"/>
    <path d="M101 239H232" stroke="#38BDF8" stroke-opacity="0.32"/>
  </g>

  <text x="318" y="118" fill="#7DD3FC" font-family="Courier New, monospace" font-size="17" letter-spacing="3">TANISHK GUPTA / PROFILE README</text>
  <text x="318" y="184" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="750">Build systems.</text>
  <text x="318" y="246" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="750">Solve problems.</text>
  <rect x="322" y="276" width="12" height="12" rx="2" fill="#0EA5E9"/>
  <text x="350" y="287" fill="#CBD5E1" font-family="Courier New, monospace" font-size="16">CSE @ MNNIT ALLAHABAD  ·  FULL STACK  ·  DSA / CP</text>

  <g opacity="0.9">
    <text x="1090" y="222" fill="#7DD3FC" font-family="Courier New, monospace" font-size="14">$ tanishk --status</text>
    <text x="1090" y="248" fill="#CBD5E1" font-family="Courier New, monospace" font-size="14">building: full-stack</text>
    <text x="1090" y="272" fill="#CBD5E1" font-family="Courier New, monospace" font-size="14">learning: systems + AI</text>
    <text x="1090" y="296" fill="#38BDF8" font-family="Courier New, monospace" font-size="14">status: shipping</text>
