<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Personal Portfolio project preview</title>
  <desc id="desc">A clean responsive portfolio layout with profile, skills, projects, and contact sections.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="460" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#E0F2FE"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="17" flood-color="#0F172A" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#bg)"/>
  <text x="54" y="58" fill="#0369A1" font-family="Courier New, monospace" font-size="15" letter-spacing="3">04 / PERSONAL PORTFOLIO</text>
  <text x="54" y="104" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="750">A clear home for the essentials.</text>
  <text x="54" y="133" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="15">Responsive structure first: profile, skills, work, and contact.</text>

  <g filter="url(#shadow)">
    <rect x="54" y="174" width="1092" height="216" rx="16" fill="#FFFFFF"/>
    <rect x="54" y="174" width="1092" height="44" rx="16" fill="#0F2E4A"/>
    <circle cx="84" cy="196" r="6" fill="#38BDF8"/>
    <text x="106" y="201" fill="#E0F2FE" font-family="Courier New, monospace" font-size="12">TANISHK GUPTA / PORTFOLIO</text>
    <text x="86" y="260" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Computer Science Student</text>
    <text x="86" y="288" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="14">MNNIT Allahabad · DSA · Web Development · ML</text>
    <rect x="86" y="318" width="122" height="30" rx="15" fill="#0EA5E9"/>
    <text x="113" y="338" fill="#FFFFFF" font-family="Courier New, monospace" font-size="11">VIEW MY WORK</text>

    <rect x="584" y="248" width="230" height="104" rx="12" fill="#F1F5F9"/>
    <text x="610" y="278" fill="#0369A1" font-family="Courier New, monospace" font-size="11" letter-spacing="1">SKILLS</text>
    <text x="610" y="308" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14">C++ · Python · JavaScript</text>
    <text x="610" y="332" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14">HTML · CSS · Git</text>

    <rect x="840" y="248" width="258" height="104" rx="12" fill="#F1F5F9"/>
    <text x="866" y="278" fill="#0369A1" font-family="Courier New, monospace" font-size="11" letter-spacing="1">CONTACT</text>
    <text x="866" y="308" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14">GitHub · LinkedIn</text>
    <text x="866" y="332" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14">Email · Coding profiles</text>
  </g>
</svg>
