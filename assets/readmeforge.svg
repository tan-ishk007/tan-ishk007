<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ReadmeForge project preview</title>
  <desc id="desc">A dark split-pane README editor with project fields on the left and a live Markdown preview on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="460" gradientUnits="userSpaceOnUse"><stop stop-color="#0B1020"/><stop offset="1" stop-color="#1B1740"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A78BFA"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#bg)"/>
  <circle cx="1050" cy="40" r="220" fill="#A78BFA" fill-opacity=".08"/>
  <text x="54" y="58" fill="#C4B5FD" font-family="ui-monospace, monospace" font-size="15" letter-spacing="3">02 / READMEFORGE</text>
  <text x="54" y="98" fill="#F8FAFC" font-family="ui-sans-serif, system-ui" font-size="28" font-weight="700">Documentation, with a live feedback loop.</text>
  <text x="54" y="127" fill="#A5B4FC" font-family="ui-sans-serif, system-ui" font-size="15">Generate, preview, and copy a README without leaving the browser.</text>

  <g filter="url(#shadow)">
    <rect x="54" y="166" width="1092" height="238" rx="16" fill="#111827" stroke="#A78BFA" stroke-opacity=".28"/>
    <rect x="54" y="166" width="478" height="238" rx="16" fill="#0F172A"/>
    <text x="82" y="202" fill="#C4B5FD" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">INPUT / PROJECT MODE</text>
    <rect x="82" y="224" width="400" height="34" rx="7" fill="#182338" stroke="#38BDF8" stroke-opacity=".38"/>
    <text x="98" y="246" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="12">owner / repository</text>
    <rect x="82" y="272" width="192" height="82" rx="9" fill="#182338"/>
    <text x="98" y="296" fill="#64748B" font-family="ui-monospace, monospace" font-size="10">PROJECT NAME</text>
    <text x="98" y="324" fill="#F8FAFC" font-family="ui-sans-serif, system-ui" font-size="15" font-weight="600">ReadmeForge</text>
    <rect x="290" y="272" width="192" height="82" rx="9" fill="#182338"/>
    <text x="306" y="296" fill="#64748B" font-family="ui-monospace, monospace" font-size="10">OUTPUT</text>
    <text x="306" y="324" fill="#7DD3FC" font-family="ui-sans-serif, system-ui" font-size="15" font-weight="600">profile.md</text>

    <rect x="532" y="166" width="614" height="238" rx="0 16 16 0" fill="#F8FAFC"/>
    <rect x="532" y="166" width="614" height="38" rx="0 16 0 0" fill="#E2E8F0"/>
    <circle cx="558" cy="185" r="5" fill="#A78BFA"/>
    <text x="578" y="190" fill="#475569" font-family="ui-monospace, monospace" font-size="11">LIVE MARKDOWN PREVIEW</text>
    <text x="570" y="240" fill="#0F172A" font-family="ui-sans-serif, system-ui" font-size="20" font-weight="700">ReadmeForge</text>
    <rect x="570" y="256" width="360" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="570" y="278" width="472" height="7" rx="3.5" fill="#E2E8F0"/>
    <rect x="570" y="293" width="418" height="7" rx="3.5" fill="#E2E8F0"/>
    <rect x="570" y="324" width="118" height="28" rx="7" fill="url(#accent)"/>
    <text x="593" y="342" fill="#FFFFFF" font-family="ui-monospace, monospace" font-size="11">COPY MARKDOWN</text>
  </g>
</svg>
