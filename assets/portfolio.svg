  <text x="54" y="110" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="750">Interfaces with a point of view.</text>
  <text x="54" y="145" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="15">Scroll-triggered movement, magnetic interactions, and resilient fallbacks.</text>

