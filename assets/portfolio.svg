<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Advanced Portfolio project preview</title>
  <desc id="desc">A dark editorial portfolio interface showing a typographic hero, project index, and a motion-inspired timeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="460" gradientUnits="userSpaceOnUse"><stop stop-color="#050B17"/><stop offset="1" stop-color="#10243A"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#BAE6FD"/><stop offset="1" stop-color="#0EA5E9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".38"/></filter>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#bg)"/>
  <path d="M720 0H1200V460H720C850 355 888 280 848 190C820 125 774 70 720 0Z" fill="#0EA5E9" fill-opacity=".08"/>
